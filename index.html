    <script>
      (function () {
        try {
          var saved = localStorage.getItem('rizik_theme') || localStorage.getItem('aharforall_theme') || localStorage.getItem('nourishloop_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved ? saved === 'dark' : prefersDark;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
          var savedLang = localStorage.getItem('rizik_lang') || localStorage.getItem('aharforall_lang') || localStorage.getItem('nourishloop_lang');
          if (savedLang === 'bn' || savedLang === 'en') {
            document.documentElement.lang = savedLang;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
